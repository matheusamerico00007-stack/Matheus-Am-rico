<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;font-family:'Inter',sans-serif;background:#000}
.v{position:absolute;inset:0;display:none}
.ph{position:absolute;inset:0;background-size:cover;background-position:center}
.shA{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,.15) 30%,rgba(0,0,0,0) 45%,rgba(0,0,0,0) 62%,rgba(0,0,0,.65) 82%,rgba(0,0,0,.85) 100%)}
.shB{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.7) 0%,rgba(0,0,0,.2) 28%,rgba(0,0,0,0) 45%,rgba(0,0,0,.25) 65%,rgba(0,0,0,.85) 88%,#000 100%)}
.box{display:inline-block;background:#FFD633;color:#111;font-weight:900;padding:8px 26px;border-radius:14px;line-height:1.1;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.c{position:absolute;width:100%;text-align:center}
.k{color:#fff;font-weight:700;letter-spacing:10px;font-size:34px;text-shadow:0 3px 12px rgba(0,0,0,.7)}
.brand{color:#fff;font-family:'Inter Display';font-weight:300;letter-spacing:34px;font-size:150px;text-shadow:0 6px 30px rgba(0,0,0,.6);padding-left:34px}
.pill{display:inline-block;border:3px solid #FFD633;color:#FFD633;font-weight:800;font-size:40px;letter-spacing:6px;padding:12px 30px;border-radius:40px;background:rgba(0,0,0,.35)}
</style></head><body>
<div class="v" id="v1">
  <div class="ph" style="background-image:url(fotoA.jpg)"></div><div class="shA"></div>
  <div class="c" style="top:300px"><span class="box" style="font-size:86px">4 QUARTOS COM</span></div>
  <div class="c" style="top:418px"><span class="box" style="font-size:86px">QUADRA DE TÊNIS</span></div>
  <div class="c" style="top:536px"><span class="box" style="font-size:86px">NA ZONA SUL?</span></div>
  <div class="c k" style="top:1400px">ORIGEM · LUXURY RESIDENCE</div>
  <div class="c" style="top:1470px"><span class="pill">ÚLTIMAS UNIDADES</span></div>
</div>
<div class="v" id="v2">
  <div class="ph" style="background-image:url(fotoB.jpg)"></div><div class="shB"></div>
  <div class="c brand" style="top:300px">ORIGEM</div>
  <div class="c k" style="top:490px">LUXURY RESIDENCE · TERRAZZAS</div>
  <div class="c" style="top:1310px"><span class="box" style="font-size:74px">4 QUARTOS</span></div>
  <div class="c" style="top:1412px"><span class="box" style="font-size:74px">QUADRA DE TÊNIS</span></div>
  <div class="c" style="top:1540px"><span class="pill">ÚLTIMAS UNIDADES</span></div>
</div>
</body></html>
