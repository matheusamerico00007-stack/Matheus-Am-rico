<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;font-family:'Inter',sans-serif;background:#0d0d10}
.v{position:absolute;inset:0;display:none}
.photo{position:absolute;left:-10px;top:215px;width:1100px;height:1955px;background:url(foto.jpg) center/cover}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,#0d0d10 0%,#0d0d10 16%,rgba(13,13,16,.8) 33%,rgba(13,13,16,0) 42%,rgba(13,13,16,0) 80%,rgba(13,13,16,.75) 90%,#0d0d10 100%)}
.tag{position:absolute;left:50%;transform:translateX(-50%);background:#FFD633;color:#111;font-weight:900;font-size:40px;letter-spacing:4px;padding:12px 30px;border-radius:14px;white-space:nowrap}
.t{position:absolute;width:100%;text-align:center;color:#fff;font-weight:900;line-height:.98;letter-spacing:-1px;text-shadow:0 6px 24px rgba(0,0,0,.6)}
.y{color:#FFD633}
.sub{position:absolute;width:100%;text-align:center;color:#fff;font-weight:800}
.box{display:inline-block;background:#FFD633;color:#111;padding:6px 22px;border-radius:12px}
.strike{position:relative;display:inline-block;color:#bdbdc6}
.strike:after{content:"";position:absolute;left:-8px;right:-8px;top:52%;height:12px;background:#E63946;transform:rotate(-4deg);border-radius:6px}
</style></head><body>
<!-- V1: gancho polêmico -->
<div class="v" id="v1">
  <div class="photo"></div><div class="shade"></div>
  <div class="tag" style="top:280px">MOTIVO 5/5</div>
  <div class="t" style="top:375px;font-size:92px">NÃO INVISTA COM<br><span class="strike">O SEU DINHEIRO</span></div>
  <div class="t" style="top:590px;font-size:104px">INVISTA COM O<br><span class="y">DINHEIRO DO LULA</span></div>
  <div class="sub" style="top:1585px;font-size:44px">IMÓVEIS · <span class="box">ALAVANCAGEM</span></div>
</div>
<!-- V2: promessa / número -->
<div class="v" id="v2">
  <div class="photo"></div><div class="shade"></div>
  <div class="tag" style="top:280px">MOTIVO 5/5 · GOVERNO LULA</div>
  <div class="t" style="top:380px;font-size:96px">COMO OS RICOS</div>
  <div class="t" style="top:478px;font-size:96px">GANHAM <span class="box" style="font-size:150px;padding:0 26px;border-radius:22px;line-height:1.05">5x</span> MAIS</div>
  <div class="t" style="top:670px;font-size:64px;color:#e6e6ea">COM O MESMO DINHEIRO</div>
  <div class="sub" style="top:1585px;font-size:44px">O SEGREDO: <span class="box">ALAVANCAGEM</span></div>
</div>
</body></html>
